<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111b2b" />
    <meta name="description" content="버튼과 키보드로 편하게 사용하는 간단한 계산기" />
    <title>계산기 · Daily Tools</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main class="page">
      <div class="intro">
        <span class="eyebrow">DAILY TOOLS <span class="eyebrow-line"></span> 01</span>
        <h1>필요한 계산을<br /><em>가볍게.</em></h1>
        <p>빠르고 간결한 일상 계산기</p>
      </div>

      <section class="calculator" aria-label="계산기">
        <div class="calculator-top">
          <div class="brand"><span class="brand-mark" aria-hidden="true">◈</span> CALCULATOR</div>
          <span class="status"><span class="status-dot" aria-hidden="true"></span> READY</span>
        </div>

        <div class="screen" aria-label="계산 결과">
          <div class="expression" id="expression" aria-live="polite">&nbsp;</div>
          <output class="result" id="result" aria-live="polite">0</output>
        </div>

        <div class="keypad" aria-label="계산기 버튼">
          <button class="key key-utility" type="button" data-action="clear" aria-label="모두 지우기">AC</button>
          <button class="key key-utility" type="button" data-action="sign" aria-label="부호 바꾸기">±</button>
          <button class="key key-utility" type="button" data-action="percent" aria-label="퍼센트">%</button>
          <button class="key key-operator" type="button" data-action="operator" data-value="/" aria-label="나누기">÷</button>

          <button class="key" type="button" data-action="digit" data-value="7">7</button>
          <button class="key" type="button" data-action="digit" data-value="8">8</button>
          <button class="key" type="button" data-action="digit" data-value="9">9</button>
          <button class="key key-operator" type="button" data-action="operator" data-value="*" aria-label="곱하기">×</button>

          <button class="key" type="button" data-action="digit" data-value="4">4</button>
          <button class="key" type="button" data-action="digit" data-value="5">5</button>
          <button class="key" type="button" data-action="digit" data-value="6">6</button>
          <button class="key key-operator" type="button" data-action="operator" data-value="-" aria-label="빼기">−</button>

          <button class="key" type="button" data-action="digit" data-value="1">1</button>
          <button class="key" type="button" data-action="digit" data-value="2">2</button>
          <button class="key" type="button" data-action="digit" data-value="3">3</button>
          <button class="key key-operator" type="button" data-action="operator" data-value="+" aria-label="더하기">+</button>

          <button class="key key-utility" type="button" data-action="backspace" aria-label="마지막 숫자 지우기">⌫</button>
          <button class="key" type="button" data-action="digit" data-value="0">0</button>
          <button class="key" type="button" data-action="decimal" aria-label="소수점">.</button>
          <button class="key key-equals" type="button" data-action="equals" aria-label="결과 보기">=</button>
        </div>
      </section>

      <div class="footer-note"><span class="note-icon" aria-hidden="true">⌨</span> 키보드 입력 지원 <span class="note-separator">·</span> Enter로 계산 <span class="note-separator">·</span> Esc로 초기화</div>
    </main>
  </body>
</html>
